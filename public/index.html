<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f12" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Pusat kontrol API AI: satu endpoint, satu API key, pemakaian token dan biaya per model." />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>AI Gateway</title>
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317171a'/%3E%3Crect x='8' y='10' width='16' height='3.5' rx='1.75' fill='%23f5f5f3'/%3E%3Crect x='8' y='18.5' width='10' height='3.5' rx='1.75' fill='%23f5f5f3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/icons.css" />
  <link rel="preload" href="/icons/meta.svg" as="image" />
  <link rel="preload" href="/icons/river-ai.png" as="image" />
</head>
<body>
  <a class="skip-link" href="#page">Langsung ke konten</a>

  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" novalidate>
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>AI Gateway</h1>
        <p>Masuk untuk melihat pemakaian dan mengatur model.</p>
      </div>
      <label class="field">
        <span>Password admin</span>
        <input class="input" type="password" id="login-password" autocomplete="current-password" enterkeyhint="go" required />
      </label>
      <button class="btn btn-primary btn-block" type="submit">Masuk ke dashboard</button>
      <p id="login-error" class="form-error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar" aria-label="Navigasi">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>AI Gateway</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="label endpoint" id="endpoint-label"></span>
        <button class="btn btn-quiet btn-sm" id="logout" style="justify-content:flex-start">
          <span class="i i-log-out i-sm" aria-hidden="true"></span>Keluar
        </button>
      </div>
    </aside>

    <header class="topbar" id="topbar">
      <span class="topbar-title" id="topbar-title">AI Gateway</span>
      <span id="topbar-action"></span>
    </header>

    <main id="page" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navigasi"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
